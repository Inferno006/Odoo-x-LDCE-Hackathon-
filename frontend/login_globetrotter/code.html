<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center relative font-body-md text-on-surface">
<!-- Background Image -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-primary/20 z-10 mix-blend-multiply"></div>
<img alt="Travel Background" class="w-full h-full object-cover z-0" data-alt="A breathtaking, wide-angle landscape photograph of an exclusive luxury resort overlooking a pristine azure ocean at sunrise. The soft, golden morning light creates a serene and premium atmosphere, perfectly aligning with a high-end travel startup aesthetic. The image features modern architectural elements blending with nature, utilizing a bright, light-mode palette of cloud whites, ocean blues, and warm sunlit hues to evoke a sense of organized adventure and sophisticated wanderlust." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8em1izBvK_J_d6_bXu9-XlgOfNl_ATRyBgfbaJtGeCSjbXXTPMynCYpi6MZRE8zFPjoPCrTnp2p5enDn9QJ-JnAA35qunnijp7OMW84TblgbK9guMz-Gcyom5wLUI5Eo2Hil7q3h0_hkpBQiCHNiXytnZRH_9Y7r8_CaLAXRm84Bzx_ER-hLHTNmKqGMddeqbLs6BGgXmHQHvhqIcFk7s50NSAh6ZzCgn26kvWExHG6c4H0X8XNDq"/>
</div>
<!-- Login Card -->
<main class="relative z-20 w-full max-w-md px-margin-mobile md:px-0">
<div class="glass-panel rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] p-unit-lg flex flex-col gap-unit-md">
<!-- Logo & Header -->
<div class="text-center mb-unit-sm">
<div class="flex items-center justify-center gap-2 mb-unit-xs">
<span class="material-symbols-outlined text-title-lg text-primary" data-icon="travel_explore">travel_explore</span>
<h1 class="font-display-lg text-title-lg font-bold text-primary">GlobeTrotter</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your account</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-unit-md" id="loginForm">
<!-- Email Field -->
<div class="flex flex-col gap-unit-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-unit-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibilityIcon">visibility</span>
</button>
</div>
</div>
<!-- Error Message (Hidden by default) -->
<div class="hidden bg-error-container text-on-error-container px-3 py-2 rounded flex items-center gap-2 mt-unit-xs font-label-sm text-label-sm" id="errorMessage">
<span class="material-symbols-outlined text-[16px]" data-icon="error">error</span>
<span>Invalid email or password.</span>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-3 rounded-full flex items-center justify-center gap-2 transition-all duration-200 mt-unit-sm shadow-sm hover:shadow-md active:scale-[0.98]" id="submitBtn" type="submit">
<span id="btnText">Sign In</span>
<span class="material-symbols-outlined hidden loading-spinner" data-icon="progress_activity" id="loadingIcon">progress_activity</span>
</button>
</form>
<!-- Register Link -->
<div class="text-center mt-unit-sm">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors ml-1" href="/register">Register</a>
</p>
</div>
</div>
</main>
<!-- Toast Notification (Hidden by default) -->
<div class="fixed bottom-margin-mobile left-1/2 -translate-x-1/2 bg-surface-container-high text-on-surface px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transition-transform duration-300 transform translate-y-full opacity-0 z-50" id="toast">
<span class="material-symbols-outlined text-primary" data-icon="info">info</span>
<span class="font-body-md text-body-md" id="toastMessage">An unexpected error occurred.</span>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const loadingIcon = document.getElementById('loadingIcon');
            const errorMessage = document.getElementById('errorMessage');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            // Toggle Password Visibility
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                visibilityIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
                visibilityIcon.setAttribute('data-icon', type === 'password' ? 'visibility' : 'visibility_off');
            });

            // Real Form Submission
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Reset errors
                errorMessage.classList.add('hidden');
                
                // Loading state
                btnText.textContent = 'Signing in...';
                loadingIcon.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.detail || 'Invalid email or password') });
                    }
                    return response.json();
                })
                .then(data => {
                    // Login success
                    localStorage.setItem('access_token', data.access_token);
                    
                    // Fetch user info
                    return fetch('http://localhost:8000/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${data.access_token}`
                        }
                    });
                })
                .then(response => {
                    if (response && response.ok) {
                        return response.json();
                    }
                    throw new Error('Could not validate user credentials after login.');
                })
                .then(user => {
                    localStorage.setItem('user', JSON.stringify(user));
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/my-journeys';
                    }, 1000);
                })
                .catch(err => {
                    // Reset loading state
                    btnText.textContent = 'Sign In';
                    loadingIcon.classList.add('hidden');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');

                    // Show inline error
                    errorMessage.querySelector('span:last-child').textContent = err.message || 'Invalid email or password.';
                    errorMessage.classList.remove('hidden');
                    showToast(err.message || 'Unable to connect to the server. Please try again later.');
                });
            });

            function showToast(message, type = 'error') {
                toastMessage.textContent = message;
                
                const icon = toast.querySelector('.material-symbols-outlined');
                if (type === 'success') {
                    icon.textContent = 'check_circle';
                    icon.setAttribute('data-icon', 'check_circle');
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-secondary');
                } else {
                    icon.textContent = 'error';
                    icon.setAttribute('data-icon', 'error');
                    icon.classList.remove('text-secondary');
                    icon.classList.add('text-error');
                }

                toast.classList.remove('translate-y-full', 'opacity-0');
                
                setTimeout(() => {
                    toast.classList.add('translate-y-full', 'opacity-0');
                }, 3000);
            }
        });
    </script>
</body></html>
