<body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen pt-16">
<!-- Top Navigation Bar -->

<button class="flex-grow text-left text-on-surface-variant bg-surface px-4 py-3 rounded-full hover:bg-surface-variant transition-colors border border-surface-dim" onclick="document.getElementById('createModal').classList.remove('hidden')">

<!-- Destination Filter Tabs -->

    <button class="dest-tab px-4 py-2 rounded-full font-label-md text-label-md bg-cloud-white border border-outline-variant hover:border-primary text-primary transition-all shadow-sm" data-dest="Goa">Goa</button>
    <button class="dest-tab px-4 py-2 rounded-full font-label-md text-label-md bg-cloud-white border border-outline-variant hover:border-primary text-primary transition-all shadow-sm" data-dest="Munnar">Munnar</button>
    <button class="dest-tab px-4 py-2 rounded-full font-label-md text-label-md bg-cloud-white border border-outline-variant hover:border-primary text-primary transition-all shadow-sm" data-dest="Amalfi">Amalfi</button>

<!-- Create Post Modal -->
<div class="hidden fixed inset-0 bg-primary/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4" id="createModal">
<div class="bg-cloud-white w-full max-w-[600px] rounded-xl shadow-lg overflow-hidden flex flex-col max-h-[921px]">
<!-- Header -->
<div class="p-4 border-b border-surface-container flex justify-between items-center bg-surface-bright">
<h2 class="font-headline-md text-title-lg text-primary">Create Experience</h2>
<button class="text-on-surface-variant hover:text-error transition-colors" onclick="document.getElementById('createModal').classList.add('hidden')">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body -->
<div class="p-unit-md overflow-y-auto flex flex-col gap-unit-md">
<div class="flex gap-3 items-center mb-2">
<img alt="User avatar" class="w-10 h-10 rounded-full object-cover" data-alt="A portrait of an adventurous young traveler with a slight smile, standing against a brightly lit out of focus cityscape background, representing a high quality user profile avatar." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD54V-lXsz9ZOvIcNRM8J1c3jEkHJ8zHG0eNfD8qyPFPqYfydr0LdunItALJx7IygJhYTgur92PkB9sOOhxn8DQnsKQ3hSJOpBBff7mIEdy2sNqjOB-9uGDv-fx6pfgyJlaxgYvqg4ascara52yC5GMsp4HHLYYdFNa0UcZArMg_iEf5DGB19_cZtNoweqCIWBXmdHTIeTD2-7WyQuEWwRc4UXtNp-0w9Hj3iauhWWS4qlz7PsEGv0A"/>
<span class="font-label-md text-label-md text-on-surface">Posting publicly</span>
</div>
<!-- Inputs -->
<div>
<input id="post-title" class="w-full border-0 border-b border-tertiary-fixed-dim focus:ring-0 focus:border-primary bg-transparent text-title-lg font-title-lg px-0 py-2 placeholder:text-on-surface-variant/50" placeholder="Title your experience..." type="text"/>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-on-surface-variant">location_on</span>
<input id="post-destination" class="w-full pl-8 border-0 border-b border-tertiary-fixed-dim focus:ring-0 focus:border-primary bg-transparent font-body-md text-body-md py-2" placeholder="Add destination..." type="text"/>
</div>
<div>
<textarea id="post-content" class="w-full border border-tertiary-fixed-dim rounded-lg focus:ring-primary focus:border-primary p-3 font-body-md text-body-md resize-none" placeholder="Share the details of your adventure..." rows="4"></textarea>
</div>
<!-- Image Upload Area -->
<div class="border-2 border-dashed border-tertiary-fixed-dim rounded-xl p-8 flex flex-col items-center justify-center gap-2 hover:bg-surface transition-colors cursor-pointer group">
<div class="p-3 bg-primary-fixed/30 rounded-full text-primary group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">cloud_upload</span>
</div>
<p class="font-label-md text-label-md text-primary">Click to upload photo or video</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">High quality images recommended</p>
</div>
<!-- Trip Link -->
<div class="flex items-center justify-between p-3 border border-tertiary-fixed-dim rounded-lg bg-surface-container-lowest">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary">flight_takeoff</span>
<span class="font-label-md text-label-md text-on-surface">Link to an itinerary (optional)</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</div>
<!-- Footer -->
<div class="p-4 border-t border-surface-container flex justify-end gap-3 bg-surface-bright">
<button class="px-4 py-2 font-label-md text-label-md text-primary border border-primary rounded-full hover:bg-primary-fixed/20 transition-colors" onclick="document.getElementById('createModal').classList.add('hidden')">Cancel</button>
<button id="post-submit-btn" class="px-6 py-2 font-label-md text-label-md text-cloud-white bg-primary rounded-full hover:bg-deep-ocean transition-colors shadow-sm">Post Experience</button>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const feedContainer = document.getElementById('feed-container');
        const destTabs = document.querySelectorAll('.dest-tab');
        const postSubmitBtn = document.getElementById('post-submit-btn');
        const postDestination = document.getElementById('post-destination');
        const postContent = document.getElementById('post-content');
        const createModal = document.getElementById('createModal');
        
        let activeDest = 'all';

        async function loadFeed() {
            let url = 'http://127.0.0.1:8000/api/posts';
            if (activeDest !== 'all') {
                url += `?destination=${activeDest}`;
            }
            
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                const posts = await res.json();
                renderFeed(posts);
            } catch (e) {
                feedContainer.innerHTML = `<p class="text-on-surface-variant text-center py-8">Failed to load community posts.</p>`;
            }
        }

        function renderFeed(posts) {
            feedContainer.innerHTML = '';
            if (posts.length === 0) {
                feedContainer.innerHTML = `<p class="text-on-surface-variant text-center py-8">No posts found for this destination. Be the first to share!</p>`;
                return;
            }

            posts.forEach(post => {
                const dateStr = new Date(post.created_at).toLocaleDateString('en-IN', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric'
                });
                
                let postImg = "/goa_beach.jpg";
                if (post.destination.toLowerCase().includes("delhi")) postImg = "/red_fort.jpg";
                else if (post.destination.toLowerCase().includes("munnar")) postImg = "/munnar_tea.jpg";
                else if (post.destination.toLowerCase().includes("agra")) postImg = "/rajasthani_feast.jpg";
                else if (post.destination.toLowerCase().includes("kyoto")) postImg = "https://lh3.googleusercontent.com/aida-public/AB6AXuCCQPRx2U-6JoCm4VnQZkmiXNgZqoggNeMULK4OE48zuf_5zSittVJlnrZNP46yzHKI88oVIkD2P6exRLA8WswUcSRZDsNMjRNMzCj-LDhBwJScLIXpNe__xnhr5afyDrVreiZR4DdbYmNtHMxRNkD4PqN82wMjjdmcr1-dYCw3_wMZMI6XNQpDJ2ptWvsGnsge56A7Om75wMRKHuhGtucCJFznqt9hCz1Ea65meDUbFtsXRrX29McN";
                else if (post.destination.toLowerCase().includes("amalfi")) postImg = "https://lh3.googleusercontent.com/aida-public/AB6AXuACMGRluFFmESEwlrZA99wdc6ocw5O4JnXNvcuMk4zcgRwIqtcvAVf6SkfM2tyCh6gz13fZuwbtenSVJZAVy6ZD5Sdbvv_BCYHi-tToqMUqqUVHAAQZOq1u2x1R79nRNRCjSe2p-BX-pQ5ogVJAnU0Hom9Xg1zQxyHjl2GAVy_crpYsPCHTDhlbXBfBkg5Mw8ICKTetBrGlgyo3zBoGZ3v-RBpmXZsvMZNCXxXIH8I6XYE_6yPvN6ww";

                const article = document.createElement('article');
                article.className = 'bg-cloud-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition-shadow duration-300 relative group text-left';
                article.innerHTML = `
                    <div class="p-unit-md flex justify-between items-start">
                        <div class="flex gap-unit-sm items-center">
                            <img alt="User avatar" class="w-10 h-10 rounded-full object-cover" src="${post.user_avatar}"/>
                            <div>
                                <p class="font-label-md text-label-md text-on-surface font-semibold">${post.user_name}</p>
                                <div class="flex items-center gap-1 text-on-surface-variant text-label-sm font-label-sm">
                                    <span>${dateStr}</span>
                                    <span>•</span>
                                    <a class="hover:text-primary transition-colors flex items-center gap-1 font-semibold" href="#">
                                        <span class="material-symbols-outlined text-[14px]">location_on</span> ${post.destination}
                                    </a>
                                </div>
                            </div>
                        </div>
                        <button class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined">more_horiz</span></button>
                    </div>
                    <div class="px-unit-md pb-unit-sm">
                        <p class="font-body-md text-body-md text-on-surface mb-2">${post.content}</p>
                    </div>
                    <div class="relative w-full aspect-[4/3] bg-surface-variant">
                        <img class="w-full h-full object-cover" src="${postImg}"/>
                    </div>
                    <div class="p-unit-md flex justify-between items-center border-t border-surface-container">
                        <div class="flex gap-unit-md">
                            <button class="flex items-center gap-1 text-on-surface-variant hover:text-secondary transition-colors group">
                                <span class="material-symbols-outlined group-hover:fill-current">favorite</span>
                                <span class="font-label-md text-label-md">${post.likes || 0}</span>
                            </button>
                            <button class="flex items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
                                <span class="material-symbols-outlined">chat_bubble</span>
                                <span class="font-label-md text-label-md">0</span>
                            </button>
                        </div>
                        <button class="text-on-surface-variant hover:text-primary transition-colors">
                            <span class="material-symbols-outlined">share</span>
                        </button>
                    </div>
                `;
                feedContainer.appendChild(article);
            });
        }

        destTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                destTabs.forEach(t => {
                    t.classList.remove('bg-primary', 'text-cloud-white');
                    t.classList.add('bg-cloud-white', 'border', 'border-outline-variant', 'text-primary');
                });
                tab.classList.remove('bg-cloud-white', 'border', 'border-outline-variant', 'text-primary');
                tab.classList.add('bg-primary', 'text-cloud-white');
                
                activeDest = tab.getAttribute('data-dest');
                loadFeed();
            });
        });

        postSubmitBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const dest = postDestination.value.trim();
            const content = postContent.value.trim();

            if (!dest || !content) {
                alert("Please fill in both the destination and description fields.");
                return;
            }

            const user = JSON.parse(localStorage.getItem('user') || 'null');
            const token = localStorage.getItem('access_token');
            if (!user || !token) {
                alert("You must be logged in to post.");
                return;
            }

            postSubmitBtn.disabled = true;
            postSubmitBtn.textContent = 'Posting...';

            try {
                const res = await fetch('http://127.0.0.1:8000/api/posts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ destination: dest, content: content })
                });

                if (!res.ok) throw new Error("Failed to post");
                
                postDestination.value = '';
                postContent.value = '';
                const postTitleInput = document.getElementById('post-title');
                if (postTitleInput) postTitleInput.value = '';
                
                createModal.classList.add('hidden');
                
                loadFeed();
            } catch (err) {
                alert("Error sharing experience. Make sure backend is running.");
            } finally {
                postSubmitBtn.disabled = false;
                postSubmitBtn.textContent = 'Post Experience';
            }
        });

        loadFeed();
    });
</script>
</body></html>
